<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Podcast</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <a class="header__logo-link" href="!#">
        <img
          class="header__logo-image"
          src="./images/logo.png"
          alt="Resonator"
          width="132"
          height="20"
          loading="lazy"
        />
      </a>
      <nav class="header__menu">
        <ul class="header__menu-list">
          <li class="header__menu-item">
            <a href="#!" class="header__menu-link header__menu-link--active"
              >Homes</a
            >
          </li>
          <li class="header__menu-item">
            <a href="#!" class="header__menu-link">Pages</a>
          </li>
          <li class="header__menu-item">
            <a href="#!" class="header__menu-link">Podcast</a>
          </li>
          <li class="header__menu-item">
            <a href="#!" class="header__menu-link">Blog</a>
          </li>
          <li class="header__menu-item">
            <a href="#!" class="header__menu-link">Shop</a>
          </li>
        </ul>
      </nav>
      <div class="header__widget-holder">
        <button class="header__search">Search</button>
        <div class="header__menu-opener menu-opener">
          <span class="menu-opener__point"></span>
          <span class="menu-opener__point"></span>
          <span class="menu-opener__point"></span>
        </div>
      </div>
    </header>

    <main class="content">
      <section class="welcome">
        <div class="welcome__wrapper">
          <div class="welcome__inner container">
            <h1 class="welcome__title">New episode available now</h1>
            <p class="welcome__description">
              Available on Apple Soundcast and Spotify.
            </p>
            <div class="welcome__buttons-wrapper">
              <button class="welcome__button">
                <img src="./images/button-1.png" alt="" />
              </button>
              <button class="welcome__button">
                <img src="./images/button-2.png" alt="" />
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="about">
        <div class="about__inner container">
          <div class="about__player player">
            <div class="player__image-wrapper">
              <img
                src="./images/player-1.jpg"
                alt=""
                class="player__image"
                width="291"
                height="291"
              />
            </div>
            <div class="player__body">
              <div class="player__info">
                <div class="player__heading">
                  <h3 class="player__title">
                    Timmy Mike: the nature of design
                  </h3>
                  <a class="player__link" href="#!">Episode page</a>
                </div>
                <div class="player__labels labels">
                  <span class="label__item">Episode 1</span>
                  <span class="label__item">Microphone</span>
                  <span class="label__item">0:13</span>
                </div>
              </div>

              <div class="player__control">
                <button class="play-button"></button>
                <div class="player__skip-buttons">
                  <button class="player__skip player__skip--back">10s</button>
                  <button class="player__skip player__skip--forward">
                    10s
                  </button>
                </div>
                <input type="range" class="player__time-slider" />
                <span class="player__time">00:00 / 00:00</span>
                <button class="player__mute"></button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
