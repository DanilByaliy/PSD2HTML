<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crossfit</title>
    <link rel="stylesheet" href="./reset.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="header">
      <a href="#!" class="header__logo">
        <img
          class="header__logo-img"
          src="./images/logo.png"
          alt="Kropp Logo"
          width="135"
          height="25"
          loading="lazy"
        />
      </a>
      <nav class="header__menu">
        <ul class="header__menu-list">
          <li class="header__menu-item">
            <a class="header__menu-link header__menu-link--active" href="#!"
              >Home</a
            >
          </li>
          <li class="header__menu-item">
            <a class="header__menu-link" href="#!">Pages</a>
          </li>
          <li class="header__menu-item">
            <a class="header__menu-link" href="#!">Portfolio</a>
          </li>
          <li class="header__menu-item">
            <a class="header__menu-link" href="#!">Blog</a>
          </li>
          <li class="header__menu-item">
            <a class="header__menu-link" href="#!">Shop</a>
          </li>
        </ul>
      </nav>
      <div class="header__actions">
        <button class="header__book-button button" type="button">
          Book now
        </button>
        <button class="header__burger-button" type="button">
          <span class="header__burger-button-line"></span>
          <span class="header__burger-button-line"></span>
          <span class="header__burger-button-line"></span>
        </button>
      </div>
    </header>
  </body>
</html>
