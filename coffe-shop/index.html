<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffee Shop</title>

    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header__greeting-wrapper">
        <div class="header__greeting container">
          <p>
            Welcome to Early Birds. We ship every Tuesday and Thursday. Free
            shipping above €25 in The Netherlands.
          </p>
        </div>
      </div>
      <div class="header__main-wrapper container">
        <div class="header__main">
          <div class="header__main-inner">
            <nav class="header__menu">
              <ul class="header__list">
                <li class="header__item">
                  <a href="#!" class="header__link">Home</a>
                </li>
                <li class="header__item">
                  <a href="#!" class="header__link">Pages</a>
                </li>
                <li class="header__item">
                  <a href="#!" class="header__link">Shop</a>
                </li>
                <li class="header__item">
                  <a href="#!" class="header__link">Blog</a>
                </li>
              </ul>
            </nav>
            <img
              src="./images/logo.png"
              alt=""
              class="header__logo"
              width="165"
              height="37"
            />
            <div class="header__widget-holder">
              <a class="header__widget-holder-link cart" href="">cart</a>
              <a class="header__widget-holder-link" href="">search</a>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="content">
      <section class="welcome">
        <div class="welcome__inner container">
          <div class="welcome__image-wrapper">
            <img
              class="welcome__image"
              src="./images/welcome/hero.jpg"
              alt=""
              width="1000"
              height="491"
            />
          </div>
          <div class="welcome__body">
            <h1 class="welcome__title">Enjoy life sip by sip</h1>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
